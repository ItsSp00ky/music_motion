<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicMotion Overlay</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="context-menu" class="context-menu">
      <div class="menu-item" data-action="toggle-click-through">
        <span>Click-Through</span>
        <span id="menu-ct-status">OFF</span>
      </div>
      <div class="menu-item" data-action="cycle-theme">
        <span>Next Theme</span>
        <span id="menu-theme-name">Frosted</span>
      </div>
      <div class="menu-item" data-action="open-themes">
        <span>Custom Themes...</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
